<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Spec Interviewer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <header class="topbar">
      <span class="brand">&gt; spec-interviewer<span class="cursor">_</span></span>
      <div class="topbar-right">
        <div class="progress" aria-live="polite">
          <span id="progress-label">Documento 1 de 9 · Planning</span>
          <div class="progress-track"><div id="progress-bar" class="progress-bar"></div></div>
        </div>
        <button type="button" id="reset" class="ghost" title="Borra el progreso y empieza de cero">reiniciar</button>
      </div>
    </header>

    <main id="chat" class="chat" aria-live="polite"></main>

    <form id="composer" class="composer" autocomplete="off">
      <span class="prompt">$</span>
      <textarea id="input" rows="1" placeholder="Escribe tu respuesta… (Enter envía, Shift+Enter salto de línea)" required></textarea>
      <button type="submit" id="send">enviar</button>
    </form>
  </div>

  <script src="app.js"></script>
</body>
</html>
